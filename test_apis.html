<!DOCTYPE html>
<html>
<head><title>API Test</title></head>
<body>
<h1>Testing IP APIs from browser</h1>
<pre id="log"></pre>
<script>
const APIs = [
  {name: 'ipapi.co', url: 'https://ipapi.co/json/'},
  {name: 'ipwho.is', url: 'https://ipwho.is/'},
  {name: 'freeipapi.com', url: 'https://freeipapi.com/api/json/'},
  {name: 'geojs.io', url: 'https://get.geojs.io/v1/ip/geo.json'},
  {name: 'ipinfo.io', url: 'https://ipinfo.io/json'},
  {name: 'ipify', url: 'https://api.ipify.org?format=json'}
];
async function test() {
  const log = document.getElementById('log');
  for (const api of APIs) {
    log.textContent += 'Testing ' + api.name + '... ';
    try {
      const res = await fetch(api.url, {cache: 'no-store'});
      const text = await res.text();
      log.textContent += 'OK (HTTP ' + res.status + ', ' + text.length + ' chars)\n';
    } catch(e) {
      log.textContent += 'FAILED: ' + e.message + '\n';
    }
  }
}
test();
</script>
</body>
</html>
